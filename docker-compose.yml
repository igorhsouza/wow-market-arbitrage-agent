services:
  postgres:
    image: postgres:15
    container_name: wow_postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 32472129
      POSTGRES_DB: wow_market
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: